# Experiment configuration — classification baseline
# Used by experiments/run_experiment.py

experiment_name: "baseline_breast_cancer"
seed: 42
test_size: 0.5

model:
  type: "NanoTabPFNClassifier"   # or "RandomForest", "GradientBoosting"
  params: {}

dataset:
  name: "breast_cancer"          # sklearn built-in

evaluation:
  metrics: ["accuracy", "roc_auc"]

output_dir: "../results/baseline_breast_cancer"
