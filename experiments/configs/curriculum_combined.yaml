# PRIMARY HYPOTHESIS - ramp the WHOLE regime narrow -> full (easy -> hard).
# The sweep showed no single knob controls difficulty, but the full regime does,
# so this is the curriculum most likely to help. Ends at the baseline regime.
name: curriculum_combined
seed: 42
steps: 2000       # total training steps, ramped at 0 / 700 / 1400
batch_size: 32
lr: 1.0e-4
num_datapoints: 200

schedule:
  0:    {min_features: 2, max_features: 4,  max_classes: 2,  noise_std: 0.02, num_layers: 2, hidden_dim: 16}
  700:  {max_features: 20, max_classes: 5,  noise_std: 0.1,  num_layers: 4, hidden_dim: 64}
  1400: {max_features: 60, max_classes: 10, noise_std: 0.3,  num_layers: 6, hidden_dim: 128}
