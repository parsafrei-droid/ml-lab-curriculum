# curriculum_combined_tuned, but with stage boundaries retimed to match
# TabICLv2's real 3-stage pretraining split instead of our usual even-ish
# 35%/35%/30% (see curriculum_combined_tuned.yaml's 700/1400 out of 2000).
#
# TabICLv2's actual recipe (tabicl/scripts/train_v2_clf_stage{1,2,3}.sh):
#   stage 1: 500,000 steps (90.9%)
#   stage 2:  40,000 steps ( 7.3%)
#   stage 3:  10,000 steps ( 1.8%)
# Note: TabICL's real stages don't ramp max_features/max_classes at all (both
# are fixed at 100/10 from step 0) - they ramp dataset size and LR instead.
# This config keeps OUR curriculum's actual knobs (features/classes/noise/
# depth, same as curriculum_combined_tuned) and only borrows TabICL's timing
# proportions, applied to our 2500-step budget (matches paper_small.yaml's
# step count - the nanoTabPFN paper's own recipe):
#   0.909 * 2500 = 2273  ->  stage 1 ends here
#   0.982 * 2500 = 2455  ->  stage 2 ends here (0.909 + 0.073 = 0.982)
# so stage 3 is a short, ~45-step "polish" tail - deliberately tiny, matching
# TabICL's own 1.8%. At CHECKPOINT_STEPS=100 granularity this tail falls
# entirely inside the last logged checkpoint (2400 -> 2500), so it won't show
# as its own visible segment in loss.csv/val.csv - only in the final numbers.
name: curriculum_combined_tabicllike
seed: 42
steps: 2500       # total training steps - matches paper_small.yaml
batch_size: 32
lr: 0.003892
num_datapoints: 200

# paper architecture (same as curriculum_combined_tuned / baseline_tuned)
heads: 4
embedding_size: 96
hidden_size: 192
layers: 3

schedule:
  0:    {min_features: 2, max_features: 4,  max_classes: 2,  noise_std: 0.02, num_layers: 2, hidden_dim: 16}
  2200: {max_features: 20, max_classes: 5,  noise_std: 0.1,  num_layers: 4, hidden_dim: 64}
  2400: {max_features: 60, max_classes: 10, noise_std: 0.3,  num_layers: 6, hidden_dim: 128}
