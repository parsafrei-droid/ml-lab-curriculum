# Scenario B: grow the number of classes, easy -> hard. Features stay wide so
# we isolate the effect of class count.
name: scenario_B
seed: 42
epochs: 5
steps: 100
batch_size: 1
lr: 1.0e-4
num_datapoints: 200

schedule:
  0:   {min_features: 2, max_features: 60, max_classes: 2}
  200: {min_features: 2, max_features: 60, max_classes: 5}
  400: {min_features: 2, max_features: 60, max_classes: 10}
