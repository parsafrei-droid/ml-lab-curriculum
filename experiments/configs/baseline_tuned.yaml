# BASELINE with the paper's training recipe: lr 3.9e-3 (we used 1e-4, ~40x too
# low) and batch 32 (we used 1). Same model + prior + eval as our other runs -
# only the tuning changes. This is the control for "is the curriculum win just
# rescuing an under-tuned baseline?"
name: baseline_tuned
seed: 42
epochs: 20        # x100 = 2000 native steps; --epochs scales it (50=5k, 100=10k)
steps: 100
batch_size: 32
lr: 0.003892
num_datapoints: 200

schedule:
  0: {min_features: 2, max_features: 60, max_classes: 10, noise_std: 0.3, num_layers: 6, hidden_dim: 128, num_causes: 12}
