# ABLATION - ramp ONLY the number of classes (2 -> 5 -> 10), everything else
# pinned at the full regime. Expected to be compute-NEUTRAL: the model always
# outputs 10 classes regardless of how many appear in the data, so fewer classes
# early doesn't make a step cheaper. Pairs with curriculum_noise as the "knobs
# that don't save compute" side of the 2x2 (features/rows do, classes/noise don't).
name: curriculum_classes
seed: 42
steps: 2000       # total training steps
batch_size: 32
lr: 1.0e-4
num_datapoints: 200

schedule:
  0:    {min_features: 2, max_features: 60, max_classes: 2,  noise_std: 0.3, num_layers: 6, hidden_dim: 128}
  700:  {max_classes: 5}
  1400: {max_classes: 10}
