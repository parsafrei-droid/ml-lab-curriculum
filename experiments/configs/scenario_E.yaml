# Scenario E: the reverse curriculum, hard -> easy. This is a sanity check: if
# curriculum order actually matters, going backwards should do *worse* than the
# easy -> hard scenario D. Same stages as D, just flipped.
name: scenario_E
seed: 42
epochs: 5
steps: 100
batch_size: 1
lr: 1.0e-4
num_datapoints: 200

schedule:
  0:   {min_features: 2, max_features: 60, max_classes: 10}
  200: {min_features: 2, max_features: 20, max_classes: 5}
  400: {min_features: 2, max_features: 5,  max_classes: 2}
