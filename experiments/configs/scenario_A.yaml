# Scenario A: grow the number of features, easy -> hard. Classes stay at the
# full range so we isolate the effect of feature count alone.
name: scenario_A
seed: 42
epochs: 5
steps: 100
batch_size: 1
lr: 1.0e-4
num_datapoints: 200

schedule:
  0:   {min_features: 2, max_features: 5,  max_classes: 10}
  200: {min_features: 2, max_features: 20, max_classes: 10}
  400: {min_features: 2, max_features: 60, max_classes: 10}
