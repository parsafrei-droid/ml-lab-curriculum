# Curriculum configuration
# Defines difficulty ordering for TabICL prior generation

curriculum_name: "feature_sweep_3to10"
description: "Gradually increase feature count from 3 to 10"

stages:
  - stage: 1
    min_features: 3
    max_features: 3
    max_num_classes: 2
    num_steps: 100
    batch_size: 32
    description: "3 features, binary"

  - stage: 2
    min_features: 3
    max_features: 5
    max_num_classes: 3
    num_steps: 200
    batch_size: 32
    description: "3–5 features, up to 3 classes"

  - stage: 3
    min_features: 3
    max_features: 10
    max_num_classes: 5
    num_steps: 500
    batch_size: 32
    description: "3–10 features, up to 5 classes"

prior:
  device: "cpu"                  # change to "cuda" if GPU available
  num_datapoints_max: 50
