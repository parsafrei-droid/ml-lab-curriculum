[project]
name = "ml-lab-curriculum"
version = "0.1.0"
description = "ML research environment: TFM-Playground + TabICL prior experiments"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy",
    "pandas",
    "matplotlib",
    "seaborn",
    "scikit-learn",
    "jupyter",
    "notebook",
    "ipykernel",
    "torch",
    "torchvision",
    "h5py",
    "ruff",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100
target-version = "py311"

# Scripts have to tweak sys.path before importing the vendored repos,
# so imports legitimately don't sit at the top of the file there.
[tool.ruff.lint.per-file-ignores]
"scripts/*" = ["E402"]
